# Supabase CLI configuration for local development (`supabase start`).
project_id = "matchday"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["matchday://", "matchday://auth/callback", "http://localhost:8081/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_verifications = 30

# Optional OAuth providers — set the secrets in supabase/.env (never commit them).
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = true

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

# Webhooks and scheduled jobs authenticate with signatures / shared secrets, not user JWTs.
[functions.stripe-webhook]
verify_jwt = false

[functions.payments-cron]
verify_jwt = false

[functions.send-notifications]
verify_jwt = false
