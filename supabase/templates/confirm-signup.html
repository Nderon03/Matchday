<div style="font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0A0C0F;color:#F5F7FA;padding:32px;border-radius:16px;max-width:480px">
  <h2 style="color:#22C55E;margin:0 0 16px">MATCHDAY</h2>
  <p style="font-size:16px;font-weight:600;margin:0 0 8px">Confirm your email</p>
  <p style="color:#97A1AE;margin:0 0 24px">Welcome to MATCHDAY! Tap the button to confirm your email and finish setting up your account.</p>
  <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email"
     style="display:inline-block;background:#22C55E;color:#0A0C0F;font-weight:700;padding:12px 20px;border-radius:10px;text-decoration:none">Confirm my email</a>
  <p style="color:#97A1AE;font-size:12px;margin:24px 0 0">Didn't sign up? You can ignore this email.</p>
</div>
