name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
      PGURL_BASE: postgresql://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npm run test:unit
      - name: Database integration & security tests (migrations + RLS)
        run: npm run test:db
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        run: deno check supabase/functions/*/index.ts
      - name: Web build
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Web smoke + visual checks
        run: npx playwright install --with-deps chromium && npm run e2e:web && node scripts/e2e-web-visual.mjs
