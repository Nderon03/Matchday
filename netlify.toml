# Web version of MATCHDAY (invite links, payment links, legal pages, and the full app in a browser).
# Netlify builds this automatically on every push to the branch you connect.
# Set EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY and EXPO_PUBLIC_APP_URL in
# Netlify → Site configuration → Environment variables.
[build]
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# single-page app: every path (e.g. /invite/abc, /legal/privacy) loads the app, which routes it
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
